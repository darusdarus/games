name: Restack stacked pull requests

# Runs the workflow file from the default branch, with permission to push the
# rewritten child branches. The job checks out that same default branch and
# runs its script. Child branches are rebased as git history and are not executed.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: restack-children
  cancel-in-progress: false

jobs:
  restack:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Replay child branches onto the merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/restack-children.sh \
            --apply \
            --old-tip "${{ github.event.pull_request.head.sha }}" \
            --new-tip "${{ github.event.pull_request.merge_commit_sha }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --merged-pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
